services:
  postgres:
    image: postgres:17
    restart: always
    environment:
      POSTGRES_DB: cardapio_digital_2
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - '127.0.0.1:6380:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: always
    ports:
      - '127.0.0.1:3011:3334'
    env_file: .env
    volumes:
      - /opt/bem-comer-data/uploads:/app/apps/api/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_PAGBANK_ENV: ${NEXT_PUBLIC_PAGBANK_ENV:-production}
        NEXT_PUBLIC_PAGBANK_PUBLIC_KEY: ${NEXT_PUBLIC_PAGBANK_PUBLIC_KEY:-}
    restart: always
    ports:
      - '127.0.0.1:3010:3000'
    depends_on:
      - api

volumes:
  pgdata:
